name: Django CI

on:
  push:
    branches:
      - develop

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set environment variables
        run: echo "SECRET_KEY=${{ secrets.SECRET_KEY }}" >> $GITHUB_ENV

      - name: Run migrations
        env:
          TEST_ENV: true
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DEBUG: True
          ALLOWED_HOSTS: localhost
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        run: python manage.py migrate

      - name: Run tests
        env:
          TEST_ENV: true
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          REDIS_HOST: redis
          REDIS_PORT: 6379
          REDIS_DB: 0
          REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}
          DJANGO_SECRET_KEY: ${{ secrets.SECRET_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          DEBUG: True
          ALLOWED_HOSTS: localhost
          EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
        run: python manage.py test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Copy project files to server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          echo "Listing files in GitHub Actions runner before rsync:"
          ls -la
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --exclude '__pycache__' --exclude '.git' --exclude '.gitignore' --exclude '.env.sample' --exclude 'venv/' ./ $SSH_USER@$SERVER_IP:$DEPLOY_DIR
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP << 'EOF'
            echo "After rsync, listing contents of $DEPLOY_DIR:"
            ls -la $DEPLOY_DIR
            ls -la $DEPLOY_DIR/config 2>/dev/null || echo "config directory not found"
          EOF

      - name: Install dependencies on server
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP << 'EOF'
            echo "Before cd, current directory:"
            pwd
            ls -la
            cd $DEPLOY_DIR || { echo "Directory $DEPLOY_DIR not found"; exit 1; }
            echo "After cd, current directory:"
            pwd
            ls -la
            sudo apt update
            sudo apt install -y python3 python3-venv python3-pip || { echo "Failed to install Python3"; exit 1; }
            python3 -m venv venv || { echo "Virtual env creation failed"; exit 1; }
            source venv/bin/activate
            pip install --upgrade pip
            echo "Before installing requirements, listing contents:"
            ls -la
            pip install -r requirements.txt || { echo "Failed to install requirements"; exit 1; }
            deactivate
          EOF

      - name: Deploy application
        env:
          SSH_USER: ${{ secrets.SSH_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_DIR: ${{ secrets.DEPLOY_DIR }}
        run: |
          ssh -o StrictHostKeyChecking=no $SSH_USER@$SERVER_IP << 'EOF'
            cd $DEPLOY_DIR || { echo "Directory $DEPLOY_DIR not found"; exit 1; }
            sudo docker compose --env-file config.env down || true
            sudo docker compose --env-file config.env up -d --build || { echo "Docker Compose failed"; exit 1; }
            sudo docker compose --env-file config.env exec -T backend python manage.py migrate || { echo "Migration failed"; exit 1; }
            sudo docker compose --env-file config.env exec -T backend python manage.py collectstatic --noinput || { echo "Collectstatic failed"; exit 1; }
            sudo cp -r static/* /var/www/myproject/static/ || { echo "Copy static files failed"; exit 1; }
            sudo systemctl restart nginx || { echo "Nginx restart failed"; exit 1; }
          EOF

      - name: Cleanup SSH
        if: always()
        run: rm -rf ~/.ssh
